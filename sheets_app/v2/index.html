<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>수학의 힘 통합 관리 시스템 v2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    /* =============================================
       수학의 힘 v2 — 프리미엄 테마 오버라이드
       ============================================= */

    /* ── 디자인 토큰 ── */
    :root {
      --theme-primary: #4f46e5;
      --theme-primary-light: rgba(79, 70, 229, 0.08);
      --theme-bg: #f8fafc;
      --theme-card-bg: #ffffff;
      --theme-border: #f1f5f9;
      --theme-text: #1e293b;
      --theme-text-muted: #64748b;
      --theme-sidebar-bg: #0f172a;
      --theme-radius-card: 16px;
      --theme-radius-btn: 10px;
      --theme-shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);
      --theme-shadow-card-hover: 0 8px 24px rgba(79, 70, 229, 0.10);
    }

    /* ── 기본 타이포 & 배경 ── */
    body {
      font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif !important;
      background-color: var(--theme-bg) !important;
      color: var(--theme-text) !important;
      letter-spacing: -0.3px !important;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 카드 ── */
    .card {
      border: 1px solid var(--theme-border) !important;
      background: var(--theme-card-bg) !important;
      border-radius: var(--theme-radius-card) !important;
      box-shadow: var(--theme-shadow-card) !important;
      transition: box-shadow 0.25s ease, transform 0.25s ease !important;
    }

    @media (hover: hover) {
      .card:hover {
        box-shadow: var(--theme-shadow-card-hover) !important;
        transform: translateY(-2px) !important;
      }
    }

    /* ── 사이드바 ── */
    #sidebar {
      background: var(--theme-sidebar-bg) !important;
      border-right: none !important;
    }

    .menu-btn {
      color: rgba(255, 255, 255, 0.6) !important;
      border-radius: 10px !important;
      padding: 0.6rem 0.85rem !important;
      margin: 2px 0.6rem !important;
      font-size: 0.85rem !important;
      transition: background 0.15s, color 0.15s !important;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #fff !important;
    }

    .menu-btn.active {
      background: var(--theme-primary) !important;
      color: #fff !important;
      font-weight: 700 !important;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35) !important;
    }

    /* ── 버튼 (모바일에서도 인라인 유지) ── */
    .btn {
      border-radius: var(--theme-radius-btn) !important;
      font-weight: 600 !important;
      transition: all 0.15s ease !important;
    }

    .btn-primary {
      background: var(--theme-primary) !important;
      border-color: var(--theme-primary) !important;
    }

    .btn-sm {
      padding: 6px 14px !important;
      font-size: 0.8rem !important;
    }

    /* ── 테이블 ── */
    .table {
      border-collapse: separate !important;
      border-spacing: 0 6px !important;
      background: transparent !important;
    }

    .table>tbody>tr {
      background: #fff !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03) !important;
      border-radius: 8px !important;
    }

    .table td,
    .table th {
      border: none !important;
      padding: 12px 14px !important;
      vertical-align: middle !important;
    }

    .table thead th {
      background: transparent !important;
      color: var(--theme-text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── 모달 ── */
    .modal-content {
      border: none !important;
      border-radius: 20px !important;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18) !important;
    }

    .modal-header {
      border-bottom: 1px solid var(--theme-border) !important;
      padding: 1.1rem 1.25rem !important;
    }

    /* ── 스크롤바 ── */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ── 대시보드 위젯 색감 ── */
    #collapseNoticePanel .card {
      border-left: 4px solid #06b6d4 !important;
    }

    #collapseTodoPanel .card {
      border-left: 4px solid #8b5cf6 !important;
    }

    /* =============================================
       📱 모바일 최적화 (768px 이하)
       ============================================= */
    @media (max-width: 768px) {

      /* 전체 여백 */
      body {
        padding-bottom: env(safe-area-inset-bottom, 20px) !important;
      }

      #view-container {
        padding: 0.75rem !important;
      }

      /* 카드 모바일 최적화 */
      .card {
        border-radius: 12px !important;
        margin-bottom: 10px !important;
      }

      /* 카드 hover 비활성 (모바일에서 점핑 방지) */
      .card:hover {
        transform: none !important;
        box-shadow: var(--theme-shadow-card) !important;
      }

      /* 버튼: 인라인 유지, 크기만 터치 친화적으로 */
      .btn {
        padding: 10px 16px !important;
        font-size: 0.85rem !important;
        min-height: 44px !important;
      }

      .btn-sm {
        padding: 8px 12px !important;
        font-size: 0.78rem !important;
        min-height: 36px !important;
      }

      /* 입력창 — iOS 줌 방지 (16px 최소) */
      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      .form-control,
      .form-select {
        padding: 10px 12px !important;
        min-height: 44px !important;
      }

      /* 테이블 모바일 */
      .table {
        border-spacing: 0 4px !important;
      }

      .table td,
      .table th {
        padding: 10px 8px !important;
        font-size: 0.78rem !important;
      }

      /* 사이드바 (style.css의 open 클래스와 통합) */
      #sidebar {
        width: 280px !important;
      }

      /* 모바일 헤더 */
      .mobile-header {
        padding: 0.6rem 0.75rem !important;
        backdrop-filter: blur(12px) !important;
        background: rgba(255, 255, 255, 0.92) !important;
      }

      /* 모달 — 하단 시트 스타일 */
      .modal-content {
        border-radius: 16px 16px 0 0 !important;
      }

      /* 대시보드 요약 카드 텍스트 크기 */
      .col-4 h4,
      .col-3 h4 {
        font-size: 1.4rem !important;
      }

      .col-4 p,
      .col-3 p {
        font-size: 0.68rem !important;
      }

      h4.fw-bold {
        font-size: 1.05rem;
      }

      /* 원장 테스트 위젯 모바일 배치 */
      #test-login-widget {
        left: 10px !important;
        bottom: 10px !important;
        width: calc(100% - 20px) !important;
        opacity: 0.9 !important;
        border-radius: 12px !important;
      }

      /* 대시보드 수업 카드 — 출결 버튼 세로 배치 금지 */
      .list-group-item .btn {
        width: auto !important;
        margin-bottom: 0 !important;
        white-space: nowrap !important;
        flex-shrink: 0 !important;
      }

      /* 대시보드 수업 카드 내부 레이아웃 정리 */
      .list-group-item.d-flex {
        gap: 8px !important;
      }

      /* 상단 요약 카드 row의 카드 padding 축소 */
      .col-4 .card-body,
      .col-3 .card-body {
        padding: 8px 4px !important;
      }

      /* 모달 footer 버튼도 인라인 유지 */
      .modal-footer .btn {
        width: auto !important;
        margin-bottom: 0 !important;
      }

      /* sidebar footer 버튼도 원래대로 */
      .sidebar-footer .btn {
        width: 100% !important;
      }

      /* 배지 크기 유지 */
      .badge {
        font-size: 0.68rem !important;
        padding: 4px 8px !important;
      }
    }

    /* 초소형 화면 (400px 미만) */
    @media (max-width: 400px) {
      #view-container {
        padding: 0.5rem !important;
      }

      .col-4 h4,
      .col-3 h4 {
        font-size: 1.2rem !important;
      }

      .col-4 p,
      .col-3 p {
        font-size: 0.62rem !important;
      }

      h4.fw-bold {
        font-size: 0.95rem;
      }

      /* 3열 요약 카드를 2열로 전환 방지 — 대신 더 작게 */
      .row.g-2>.col-4 {
        padding: 2px !important;
      }
    }

    /* 💡 [보완 패치] 핸드폰에서 출결 입력을 진짜 편하게! */
    @media (max-width: 768px) {

      /* 1. 출결 모달 왼쪽 학생 메뉴 숨기기 (공간 확보) */
      #modal-student-nav {
        display: none !important;
      }

      /* 2. 상단 날짜/공통진도 칸을 세로로 큼직하게 배치 */
      #attendanceModal .sticky-top .row>[class*='col-'] {
        width: 100% !important;
        text-align: left !important;
        margin-bottom: 8px;
      }

      /* 3. 알림톡 미리보기 창이 화면을 가리지 않게 조정 */
      #livePreviewPanel {
        width: calc(100% - 20px) !important;
        right: 10px !important;
        top: auto !important;
        bottom: 70px !important;
        max-height: 50vh !important;
      }

      /* 4. 학생별 입력 카드(row) 사이 간격 확보 */
      .student-row {
        padding: 1.5rem 1rem !important;
        margin-bottom: 2rem !important;
        border-top: 4px solid var(--theme-primary) !important;
      }

      /* 5. 텍스트 영역(종합안내 등) 높이 키우기 */
      textarea.form-control {
        min-height: 120px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 로그인 화면 ===== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-calculator-fill"></i>
      </div>
      <h2 class="fw-black mb-1">수학의 힘</h2>
      <p class="text-muted mb-4">통합 관리 시스템 v2.0</p>
      <div id="google-signin-btn"></div>
      <p class="text-muted small mt-4">구글 계정으로 로그인하세요</p>
      <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>

  <!-- ===== 메인 앱 ===== -->
  <div id="main-app" class="d-none">
    <!-- 사이드바 -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="bi bi-calculator-fill"></i></div>
        <div>
          <div class="fw-bold">수학의 힘</div>
          <div class="small opacity-75" id="userRoleDisplay">로딩 중...</div>
        </div>
      </div>

      <div class="sidebar-menu">
        <div class="sidebar-divider">수업 관리</div>
        <button class="menu-btn active" id="menu-DASHBOARD" onclick="switchView('DASHBOARD')">
          <i class="bi bi-grid-1x2-fill"></i> 대시보드
        </button>
        <button class="menu-btn" id="menu-SCHEDULE" onclick="switchView('SCHEDULE')">
          <i class="bi bi-calendar-week-fill"></i> 주간 시간표
        </button>
        <button class="menu-btn" id="menu-ABSENT" onclick="switchView('ABSENT')">
          <i class="bi bi-person-x-fill"></i> 보강 관리
        </button>

        <div class="sidebar-divider">학생 관리</div>
        <button class="menu-btn" id="menu-STUDENT" onclick="switchView('STUDENT')">
          <i class="bi bi-people-fill"></i> 학생 관리
        </button>
        <button class="menu-btn" id="menu-REGISTER" onclick="switchView('REGISTER')">
          <i class="bi bi-journal-plus"></i> 수강 등록
        </button>
        <button class="menu-btn" id="menu-COUNSEL" onclick="switchView('COUNSEL')">
          <i class="bi bi-chat-dots-fill"></i> 상담 기록
        </button>
        <button class="menu-btn" id="menu-COUNSEL_REQ" onclick="switchView('COUNSEL_REQ')">
          <i class="bi bi-calendar-check"></i> 상담 요청
        </button>

        <div class="sidebar-divider">조회 및 분석</div>
        <button class="menu-btn" id="menu-HISTORY" onclick="switchView('HISTORY')">
          <i class="bi bi-journal-bookmark-fill"></i> 기록 조회
        </button>
        <button class="menu-btn" id="menu-SCORE" onclick="switchView('SCORE')">
          <i class="bi bi-bar-chart-fill"></i> 성적 관리
        </button>
        <button class="menu-btn" id="menu-BOOK" onclick="switchView('BOOK')">
          <i class="bi bi-book-fill"></i> 교재 관리
        </button>

        <div class="sidebar-divider">강사</div>
        <button class="menu-btn mb-4" id="menu-TATT" onclick="switchView('TATT')">
          <i class="bi bi-clock-history"></i> 강사 근태
        </button>
      </div>
      <div class="sidebar-footer border-top border-secondary border-opacity-25 pt-3 mx-3 pb-3">
        <button class="btn btn-sm btn-outline-warning w-100 mb-2 fw-bold" id="btn-global-zoom"
          onclick="toggleGlobalZoom()">
          <i class="bi bi-zoom-in"></i> 화면 크게 보기
        </button>
        <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="forceRefresh()">
          <i class="bi bi-arrow-clockwise"></i> 새로고침
        </button>
        <button class="btn btn-sm btn-outline-danger w-100" onclick="logoutApp()">
          <i class="bi bi-box-arrow-left"></i> 로그아웃
        </button>
      </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main id="main-content">
      <!-- 모바일 헤더 -->
      <div class="mobile-header">
        <button class="btn btn-sm" onclick="toggleSidebar()"
          style="background:none; border:none; padding:6px; min-height:auto;">
          <i class="bi bi-list fs-4" style="color: var(--theme-text);"></i>
        </button>
        <span class="fw-bold" id="mobile-page-title" style="font-size: 0.95rem; color: var(--theme-text);">수학의 힘</span>
        <button class="btn btn-sm" onclick="forceRefresh()"
          style="background:none; border:none; padding:6px; min-height:auto;">
          <i class="bi bi-arrow-clockwise" style="color: var(--theme-text-muted); font-size: 1.1rem;"></i>
        </button>
      </div>
      <div id="view-container" class="p-3 p-md-4"></div>
    </main>
  </div>

  <!-- 로딩 오버레이 -->
  <div id="loading-overlay">
    <div class="text-center text-white">
      <div class="spinner-border mb-3" style="width:3rem;height:3rem;"></div>
      <div class="fw-bold fs-5" id="loading-msg">데이터 불러오는 중...</div>
    </div>
  </div>

  <!-- ===== 모달: 출결 입력 ===== -->
  <div class="modal fade" id="attendanceModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-fullscreen-lg-down modal-dialog-centered">
      <div class="modal-content" style="height: 90vh;">

        <div class="modal-header bg-primary text-white py-2 d-flex align-items-center">
          <h5 class="modal-title fw-bold small m-0"><i class="bi bi-journal-text me-2"></i>출결 및 일일 브리핑 작성</h5>
          <button type="button" class="btn btn-sm btn-light text-primary fw-bold ms-auto me-3 rounded-pill shadow-sm"
            onclick="openTemplateBuilder()">
            <i class="bi bi-magic"></i> 템플릿 제작 및 공유
          </button>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="bg-white border-bottom px-3 py-2 sticky-top" style="z-index: 1051;">
          <div class="row align-items-center g-2">
            <div class="col-md-3">
              <label class="fw-bold small mb-1 text-secondary">수업 일자</label>
              <input type="date" class="form-control form-control-sm" id="checkDate">
            </div>
            <div class="col-md-5">
              <label class="fw-bold small mb-1 text-primary">📚 반 전체 공통 진도 (선택)</label>
              <input type="text" class="form-control form-control-sm border-primary shadow-sm" id="classProgress"
                placeholder="예: 쎈 수학 1단원 다항식의 연산">
            </div>
            <div class="col-md-4 text-end d-flex flex-column align-items-end justify-content-center">
              <div class="text-primary fw-bold small mb-1" id="modalClassInfo"></div>
              <button class="btn btn-sm btn-outline-success fw-bold" onclick="setAllAttendance('출석')"
                style="font-size: 0.7rem;"><i class="bi bi-person-check me-1"></i>전원 출석 처리</button>
            </div>
          </div>
        </div>

        <div class="modal-body p-0 d-flex flex-row overflow-hidden bg-light">
          <nav id="modal-student-nav" class="bg-white border-end d-none d-md-block"
            style="width: 170px; overflow-y: auto; flex-shrink: 0;">
            <div class="list-group list-group-flush" id="studentNavList"></div>
          </nav>

          <div id="studentCheckList" class="flex-grow-1 overflow-auto p-3" style="scroll-behavior: smooth;">
            <div class="text-center py-4 text-muted">학생 정보를 불러오는 중입니다...</div>
          </div>

          <button id="previewToggleBtn" class="btn btn-success shadow-lg fw-bold"
            style="position: absolute; right: 25px; top: 20px; z-index: 1051; border-radius: 30px; display: none;"
            onclick="toggleLivePreview()">
            <i class="bi bi-chat-left-text-fill me-1"></i> 미리보기 켜기
          </button>

          <div id="livePreviewPanel" class="shadow-lg"
            style="position: absolute; right: 25px; top: 20px; width: 330px; max-height: calc(100% - 40px); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 2px solid #2ecc71; border-radius: 12px; padding: 15px; z-index: 1050; opacity: 0; transition: opacity 0.2s ease; overflow-y: auto;">
            <div
              class="d-flex justify-content-between align-items-center mb-2 border-bottom border-success border-opacity-25 pb-2">
              <h6 class="fw-bold text-success m-0"><i class="bi bi-chat-quote-fill"></i> 실시간 알림톡 미리보기</h6>
              <button type="button" class="btn-close btn-sm" onclick="toggleLivePreview()" title="접어두기"></button>
            </div>
            <div id="livePreviewContent"
              style="font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; color: #1e293b; font-weight: 500;">
            </div>
          </div>
        </div>

        <div class="modal-footer bg-light py-2 d-flex justify-content-between flex-wrap gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary px-4 fw-bold"
            data-bs-dismiss="modal">닫기</button>
          <div>
            <button type="button" class="btn btn-sm btn-warning text-dark fw-bold px-4 me-2 shadow-sm"
              onclick="saveAttendance('임시저장', false)">💾 내용 임시저장</button>
            <button type="button" class="btn btn-sm btn-primary fw-bold px-4 shadow"
              onclick="saveAttendance('최종제출', false)">✅ 최종제출 및 알림톡</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 모달: 보강 등록 ===== -->
  <div class="modal fade" id="makeupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus"></i> 보강 일정 등록</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="fw-bold small">학생명</label>
            <input type="text" class="form-control bg-light" id="mk_student" readonly>
            <input type="hidden" id="mk_student_id">
          </div>
          <div class="mb-3">
            <label class="fw-bold small">원래 결석일</label>
            <input type="date" class="form-control bg-light" id="mk_absentDate" readonly>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="fw-bold small">보강 날짜</label>
              <input type="date" class="form-control" id="mk_date" onchange="checkSameDayClasses()">
            </div>
            <div class="col">
              <label class="fw-bold small">담당 강사</label>
              <select class="form-select" id="mk_teacher"></select>
            </div>
          </div>
          <div id="mk_conflict_alert" style="display: none;" class="alert alert-warning mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <strong id="mk_conflict_title">주의!</strong>
            <div id="mk_conflict_content" style="font-size: 0.9rem; margin-top: 8px;"></div>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="fw-bold small">시작 시간</label>
              <input type="time" class="form-control" id="mk_start" value="17:00">
            </div>
            <div class="col">
              <label class="fw-bold small">종료 시간</label>
              <input type="time" class="form-control" id="mk_end" value="19:00">
            </div>
          </div>
          <div class="mb-3">
            <label class="fw-bold small">강의실</label>
            <input type="text" class="form-control" id="mk_room" placeholder="예: 본관-R1">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
          <button class="btn btn-danger fw-bold" onclick="submitMakeup()">보강 예약 확정</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="templateBuilderModal" tabindex="-1" style="z-index: 1060;">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title fw-bold"><i class="bi bi-magic"></i> 알림톡 템플릿 제작소 (전체 공유)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 bg-light">
          <div class="mb-3">
            <label class="fw-bold small text-info mb-1">1. 템플릿 제목 (선생님 이름이 자동으로 붙습니다)</label>
            <input type="text" id="tb-title" class="form-control border-info fw-bold"
              placeholder="예: 꼼꼼 피드백용, 시험기간 특별양식">
          </div>
          <div class="mb-3">
            <label class="fw-bold small text-info mb-1">2. 자동 입력 태그 (클릭하면 쏙 들어갑니다!)</label>
            <div class="d-flex flex-wrap gap-1 p-2 bg-white rounded border border-info border-opacity-25 shadow-sm">
              <button class="btn btn-sm btn-outline-primary fw-bold" onclick="insertTag('{학생이름}')">{학생이름}</button>
              <button class="btn btn-sm btn-outline-primary fw-bold" onclick="insertTag('{강사이름}')">{강사이름}</button>
              <button class="btn btn-sm btn-outline-primary fw-bold" onclick="insertTag('{날짜}')">{날짜}</button>
              <button class="btn btn-sm btn-outline-success fw-bold" onclick="insertTag('{오늘진도}')">{오늘진도}</button>
              <button class="btn btn-sm btn-outline-success fw-bold" onclick="insertTag('{다음과제}')">{다음과제}</button>
              <button class="btn btn-sm btn-outline-danger fw-bold" onclick="insertTag('{테스트종류}')">{테스트종류}</button>
              <button class="btn btn-sm btn-outline-danger fw-bold" onclick="insertTag('{맞은개수}')">{맞은개수}</button>
              <button class="btn btn-sm btn-outline-danger fw-bold" onclick="insertTag('{전체개수}')">{전체개수}</button>
              <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="insertTag('{개별학습}')">{개별학습}</button>
              <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="insertTag('{과제피드백}')">{과제피드백}</button>
              <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="insertTag('{종합안내}')">{종합안내}</button>
              <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="insertTag('{새교재}')">{새교재}</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="fw-bold small text-info mb-1">3. 템플릿 내용 작성</label>
            <textarea id="tb-content" class="form-control border-info shadow-sm" rows="10"
              placeholder="위 태그 버튼을 누르면서 자유롭게 문장을 완성해보세요!"></textarea>
          </div>
        </div>
        <div class="modal-footer bg-white">
          <button class="btn btn-secondary rounded-pill fw-bold" data-bs-dismiss="modal">취소</button>
          <button class="btn btn-info text-white rounded-pill fw-bold px-4 shadow" id="btn-save-template"
            onclick="saveTemplate()">
            <i class="bi bi-share-fill me-1"></i> 템플릿 저장 및 공유하기
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- ===== 모달: 학생 상세 프로필 ===== -->
  <div class="modal fade" id="studentProfileModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white py-2 d-flex align-items-center">
          <h5 class="modal-title fw-bold m-0"><i class="bi bi-person-badge"></i> 학생 상세 프로필</h5>
          <button type="button" class="btn btn-sm btn-light text-primary fw-bold ms-auto me-3 rounded-pill shadow-sm"
            onclick="toggleProfileZoom(this)">
            <i class="bi bi-zoom-in"></i> 글자 돋보기
          </button>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body bg-light" id="studentProfileBody" style="transition: zoom 0.2s ease;">
          <!-- JS 동적 렌더링 영역 -->
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
        <div class="modal-footer">
          <div id="studentProfileActions"></div>
          <button class="btn btn-secondary fw-bold" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 교재 datalist -->
  <datalist id="globalBookList"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <div id="teacher-widgets-container"></div>

  <!-- ★ 핵심: Google Identity Services (OAuth 2.0) -->
  <!-- 구글 라이브러리 로드 완료 후 initGoogleAuth() 실행 보장 -->
  <script>
    function onGoogleLibraryLoad() {
      if (typeof initGoogleAuth === 'function') {
        initGoogleAuth();
      }
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="onGoogleLibraryLoad()"></script>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>

</html>
